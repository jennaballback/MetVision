# Weekly incremental load: objects the Met added or changed since the last
# successful run -> fetch -> transform -> images -> CLIP -> pgvector.
# Needs a hosted Postgres with pgvector (Neon, Supabase, RDS...) in the
# DATABASE_URL repository secret.
name: weekly-ingest

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Override start date (YYYY-MM-DD)"
        required: false

concurrency: { group: ingest, cancel-in-progress: false }

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPARTMENTS: ${{ vars.DEPARTMENTS || '6' }}
      IMAGE_DIR: /tmp/images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache CLIP weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-${{ hashFiles('metsearch/config.py') }}
      - name: Incremental run
        run: python -m metsearch incremental ${{ inputs.since && format('--since {0}', inputs.since) || '' }}
      - name: Summary
        if: always()
        run: python -m metsearch stats >> "$GITHUB_STEP_SUMMARY"
