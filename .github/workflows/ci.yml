name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: met, POSTGRES_PASSWORD: met, POSTGRES_DB: met }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U met" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://met:met@localhost:5432/met
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # Tests use the fake Met server and FakeEmbedder, so torch/CLIP are not needed.
      - run: pip install "psycopg[binary]" pgvector requests numpy pillow anthropic pytest
      - run: pytest -q
